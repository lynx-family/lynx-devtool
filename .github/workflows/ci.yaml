name: Build All Packages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [lynx-ubuntu-22.04-medium]
        node-version: [18.20.2]
        pnpm-version: [7.33.6]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lbzip2

      - name: Python Setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: ${{ matrix.node-version }}
          
      - name: Install pnpm ${{ matrix.pnpm-version }}
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: ${{ matrix.pnpm-version }}
          
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: Install dependencies
        run: pnpm install

      - name: Fetch depot_tools
        run: |
          pnpm run fetch:depot_tools
          echo "fetch:depot_tools done"

      - name: Sync devtools-gn
        run: |
          export PATH=$(pwd)/packages/devtools-frontend-lynx/buildtools/depot_tools:$PATH
          pnpm run sync:devtools-gn
          echo "sync:devtools-gn done"
      
      - name: Build devtools-gn
        run: |
          pnpm run build:devtools
          echo "build:devtools done"

      - name: Sync devtools-dist
        run: |
          pnpm run sync:devtools-dist
          echo "sync:devtools-dist done"

      - name: Build all packages
        run: |
          pnpm run build:all
          echo "build:all done"
