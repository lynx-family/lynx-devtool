name: Simulator Release

# Publishes @lynx-js/lynx-simulator-core and @lynx-js/lynx-simulator to npm when
# their versions change. Versions already on npm are skipped. npm authenticates
# this workflow as a trusted publisher through GitHub OIDC, so no npm token is
# stored in the repository.

on:
  push:
    branches:
      - main
    paths:
      - 'lynx-simulator/packages/*/package.json'
      - '.github/workflows/simulator-release.yml'

permissions: {}

jobs:
  release:
    name: Release
    runs-on: macos-latest
    environment: npm
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: lynx-simulator

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      # Build with the Node.js version the workspace requires (.nvmrc).
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: lynx-simulator/.nvmrc
          package-manager-cache: false

      - name: Install dependencies
        env:
          # Publishing does not run the app, so skip the Lynxtron runtime download.
          LYNXTRON_SKIP_DOWNLOAD: '1'
        run: |
          # Trusted publishing needs npm 11.5.1 or later; Node.js 22 ships npm 10.
          npm install -g npm@^11.5.1
          npm install -g corepack
          corepack enable
          npm --version
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Core goes first because the simulator depends on its exact version.
      # Prerelease versions such as 0.1.0-alpha.0 are published under their
      # identifier (alpha) instead of latest.
      - name: Publish to npm
        run: |
          for dir in packages/core packages/simulator; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            # Only a 404 means the version is not published. Any other error,
            # such as a network failure, stops the release with its output.
            if output=$(npm view "$name@$version" version 2>&1); then
              echo "$name@$version is already published."
              continue
            fi
            if ! grep -q 'E404' <<< "$output"; then
              echo "$output"
              echo "::error::Could not check whether $name@$version is published."
              exit 1
            fi
            tag=latest
            case "$version" in
              *-*) tag=$(echo "${version#*-}" | cut -d. -f1) ;;
            esac
            echo "Publishing $name@$version with tag $tag."
            (cd "$dir" && npm publish --access public --tag "$tag")
          done
